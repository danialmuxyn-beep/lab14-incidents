groups:
  # ---------- SLO: 99.5 % of checkouts succeed over 30 days ----------
  # error budget = 0.5 % ; burn rate = error ratio / 0.005
  - name: checkout-slo-recording
    rules:
      - record: checkout:error_ratio:rate5m
        expr: |
          (sum(rate(http_requests_total{job="shop",route="/api/checkout",status=~"5.."}[5m])) or vector(0))
          / sum(rate(http_requests_total{job="shop",route="/api/checkout"}[5m]))
      - record: checkout:error_ratio:rate30m
        expr: |
          (sum(rate(http_requests_total{job="shop",route="/api/checkout",status=~"5.."}[30m])) or vector(0))
          / sum(rate(http_requests_total{job="shop",route="/api/checkout"}[30m]))
      - record: checkout:error_ratio:rate1h
        expr: |
          (sum(rate(http_requests_total{job="shop",route="/api/checkout",status=~"5.."}[1h])) or vector(0))
          / sum(rate(http_requests_total{job="shop",route="/api/checkout"}[1h]))
      - record: checkout:error_ratio:rate6h
        expr: |
          (sum(rate(http_requests_total{job="shop",route="/api/checkout",status=~"5.."}[6h])) or vector(0))
          / sum(rate(http_requests_total{job="shop",route="/api/checkout"}[6h]))

      - record: checkout:burn_rate:rate5m
        expr: checkout:error_ratio:rate5m / 0.005
      - record: checkout:burn_rate:rate30m
        expr: checkout:error_ratio:rate30m / 0.005
      - record: checkout:burn_rate:rate1h
        expr: checkout:error_ratio:rate1h / 0.005
      - record: checkout:burn_rate:rate6h
        expr: checkout:error_ratio:rate6h / 0.005

  - name: alerts
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 30s
        labels:
          severity: page
        annotations:
          summary: '{{ $labels.job }} is down (target {{ $labels.instance }} does not answer scrapes)'
          runbook_url: https://github.com/danialmuxyn-beep/lab14-incidents/blob/main/runbooks/target-down.md

      # Replaces the noisy ErrorsDetected: a ratio, a minimum of traffic, "for:", per service.
      - alert: HighErrorRatio
        expr: |
          (
            sum by (job) (rate(http_requests_total{status=~"5.."}[5m]))
            / sum by (job) (rate(http_requests_total[5m]))
          ) > 0.05
          and
          sum by (job) (rate(http_requests_total[5m])) > 0.2
        for: 2m
        labels:
          severity: ticket
        annotations:
          summary: '{{ $labels.job }}: {{ $value | humanizePercentage }} of requests return 5xx (threshold 5 %, over 5m)'
          runbook_url: https://github.com/danialmuxyn-beep/lab14-incidents/blob/main/runbooks/high-error-ratio.md

      # Fast burn: 14.4x over 1h AND 5m -> page (2 % of the 30-day budget gone in 1 hour)
      - alert: CheckoutErrorBudgetFastBurn
        expr: |
          checkout:burn_rate:rate1h > 14.4
          and
          checkout:burn_rate:rate5m > 14.4
        for: 1m
        labels:
          severity: page
          slo: checkout
        annotations:
          summary: 'Checkout error budget burns {{ $value | printf "%.1f" }}x too fast (1h and 5m windows, limit 14.4x)'
          runbook_url: https://github.com/danialmuxyn-beep/lab14-incidents/blob/main/runbooks/checkout-slo.md

      # Slow burn: 6x over 6h AND 30m -> ticket (5 % of the budget gone in 6 hours)
      - alert: CheckoutErrorBudgetSlowBurn
        expr: |
          checkout:burn_rate:rate6h > 6
          and
          checkout:burn_rate:rate30m > 6
        for: 5m
        labels:
          severity: ticket
          slo: checkout
        annotations:
          summary: 'Checkout error budget burns {{ $value | printf "%.1f" }}x too fast (6h and 30m windows, limit 6x)'
          runbook_url: https://github.com/danialmuxyn-beep/lab14-incidents/blob/main/runbooks/checkout-slo.md
