route:
  receiver: tickets
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="page"
      receiver: pager
      repeat_interval: 1h

inhibit_rules:
  - source_matchers:
      - alertname="TargetDown"
      - job="payments"
    target_matchers:
      - alertname=~"Checkout.*|HighErrorRatio"

receivers:
  - name: pager
    webhook_configs:
      - url: http://webhook:8080/pager
        send_resolved: true
  - name: tickets
    webhook_configs:
      - url: http://webhook:8080/tickets
        send_resolved: true
